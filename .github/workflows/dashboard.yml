name: Public activity dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '48 5 * * *'
  push:
    paths:
      - 'scripts/dashboard.py'
      - '.github/workflows/dashboard.yml'
permissions:
  contents: write
concurrency:
  group: public-activity-dashboard
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Render activity and top languages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dashboard.py
      - name: Publish updated dashboard
        run: |
          git add assets/dashboard.svg
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh public activity dashboard'
            git pull --rebase
            git push
          fi
